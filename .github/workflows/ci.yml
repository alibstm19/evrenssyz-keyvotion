name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 26]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Check public content
        run: node tools/verify/public-content.js

      - name: Install dependencies
        working-directory: src
        run: npm ci

      - name: Test totals (TAP)
        run: node tools/verify/tap-count.js tests

      - name: Health check
        run: node tools/doctor.js

      - name: Quality gate k3
        run: node tools/k3.js

      - name: HTML integrity
        run: node tools/verify/html-check.js
